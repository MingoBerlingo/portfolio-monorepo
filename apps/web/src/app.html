<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			try {
				const theme = localStorage.getItem('theme');
				if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
			} catch {
				/* Use the system preference when storage is unavailable. */
			}
		</script>
		<noscript>
			<style>
				/* Keep JS video space reserved until hydration. Only no-JS uses the fallback. */
				.media-frame[data-media] > video[data-deferred] {
					display: none;
				}
				.media-frame[data-media][data-media-state] > img:not([data-preview]) {
					opacity: 1;
				}
				.media-frame[data-media] > .media-preview,
				.media-frame[data-media]::after {
					display: none;
				}
			</style>
		</noscript>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
