<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curriculum Studio</title><link rel="stylesheet" href="/app.css"><script type="module" src="/app.mjs"></script></head>
<body>
<header class="app-header"><a class="brand" href="/" aria-label="Curriculum Studio home"><span class="brand-icon">c.</span><span>Curriculum <span class="brand-light">Studio</span></span></a><div class="header-actions"><div class="version-indicator"><span id="dirty-dot"></span><span id="version-status">No CV loaded</span></div><label class="sr-only" for="locale">Language</label><select id="locale"><option value="en">🇬🇧 EN</option><option value="it">🇮🇹 IT</option></select></div></header>
<div class="toolbar"><div class="toolbar-left"><button id="reload" class="button">↻ Load from CMS</button><button id="history" class="button">History <span id="history-count" class="count">0</span></button></div><div class="toolbar-right"><label class="sr-only" for="zoom">Canvas zoom</label><select id="zoom"><option value="fit">Fit</option><option value="1">100%</option><option value="1.25">125%</option></select><button id="save" class="button" disabled>Save version</button><button id="download" class="button primary" disabled>↓ Download PDF</button></div></div>
<p id="notice" role="status" class="notice" hidden></p>
<main>
<div id="empty" class="empty-state"><h1>Curriculum</h1><button id="empty-load" class="button primary">Load from CMS</button></div>
<div id="workspace" class="workspace" hidden>
<aside class="section-nav"><label class="sr-only" for="section-select">Section</label><select id="section-select"></select><nav id="sections" aria-label="CV sections"></nav><div id="section-controls" class="section-controls"></div></aside>
<section id="canvas-pane" class="canvas-pane" aria-label="Editable curriculum"><div id="canvas-wrap" class="canvas-wrap"><div id="canvas" role="group" aria-label="Editable CV layout"></div></div></section>
</div>
</main>
<dialog id="save-dialog"><form id="save-form"><div class="dialog-top"><button class="icon-button" type="button" data-close="save-dialog" aria-label="Close save dialog">×</button></div><h2>Save version</h2><label for="version-name">Version name</label><input id="version-name" name="versionName" required maxlength="120" placeholder="e.g. Product designer · Acme" autocomplete="off"><p id="save-error" class="error" role="alert" hidden></p><div class="dialog-actions"><button class="button" type="button" data-close="save-dialog">Cancel</button><button class="button primary" type="submit">Save version</button></div></form></dialog>
<dialog id="history-dialog" class="history-dialog"><div class="dialog-top"><button class="icon-button" type="button" data-close="history-dialog" aria-label="Close history">×</button></div><h2>History</h2><div id="history-list"></div></dialog>


<dialog id="details-dialog"><form id="details-form"><div class="dialog-top"><h2 id="details-title">Edit details</h2><button class="icon-button" type="button" data-close="details-dialog" aria-label="Close details">×</button></div><div id="details-fields"></div><p id="details-error" class="error" role="alert" hidden></p><div class="dialog-actions"><button class="button" type="button" data-close="details-dialog">Cancel</button><button class="button primary" type="submit">Apply</button></div></form></dialog>
</body></html>
